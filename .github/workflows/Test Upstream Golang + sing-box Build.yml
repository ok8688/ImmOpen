name: 🧪 SNAPSHOT GCC libgcc_s Source Locate

on:
  workflow_dispatch:

jobs:
  locate-libgcc-source:
    runs-on: ubuntu-22.04
    timeout-minutes: 5

    steps:
      - name: Checkout SNAPSHOT
        run: |
          set -euo pipefail
          git clone --depth=1 -b master \
            https://github.com/immortalwrt/immortalwrt.git openwrt >/dev/null 2>&1
          cd openwrt
          echo "REV=$(git rev-parse --short HEAD)"

      - name: Locate GCC libgcc_s Logic
        run: |
          set -euo pipefail
          cd openwrt

          {
            echo "=== GCC SOURCE ==="
            grep -RniE \
              'libgcc_s\.so|install.*libgcc|libgcc.*install|gcc.*final' \
              toolchain/gcc \
              2>/dev/null | head -40

            echo
            echo "=== TOOLCHAIN DIR ==="
            grep -nE \
              'TOOLCHAIN_DIR_NAME|TOOLCHAIN_DIR=' \
              rules.mk

            echo
            echo "=== LIBGCC VARIABLES ==="
            grep -nE \
              '^LIBGCC_(S|A)|libgcc_s\.so' \
              rules.mk

            echo
            echo "=== PACKAGE TOOLCHAIN ==="
            grep -nE \
              'LIBGCC_SO|libgcc_s\.so' \
              package/libs/toolchain/Makefile
          } | tee ../libgcc-source.txt
