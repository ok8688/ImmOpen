name: 🧪 SNAPSHOT libgcc_s Toolchain Locate

on:
  workflow_dispatch:

jobs:
  locate-libgcc:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout SNAPSHOT
        run: |
          set -euo pipefail
          git clone --depth=1 -b master \
            https://github.com/immortalwrt/immortalwrt.git openwrt
          cd openwrt
          echo "REV=$(git rev-parse --short HEAD)"

      - name: Update Feeds
        run: |
          set -euo pipefail
          cd openwrt
          ./scripts/feeds update -a >/dev/null 2>&1

      - name: Build Toolchain Only
        run: |
          set -euo pipefail
          cd openwrt

          cat > .config <<'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y
          EOF

          make defconfig >/dev/null 2>&1
          make toolchain/install -j"$(nproc)" >/dev/null 2>&1

      - name: Locate libgcc_s
        run: |
          set -euo pipefail
          cd openwrt

          echo "=== TOOLCHAIN DIRS ==="
          find staging_dir -maxdepth 2 -type d -name 'toolchain-*' -print

          echo "=== libgcc_s ==="
          find staging_dir build_dir -type f \
            \( -name 'libgcc_s.so' -o -name 'libgcc_s.so.*' \) \
            -print 2>/dev/null

          echo "=== EXPECTED PATH ==="
          EXPECTED="staging_dir/toolchain-x86_64_gcc-14.4.0_musl/lib"
          echo "$EXPECTED"

          if [ -d "$EXPECTED" ]; then
            echo "EXPECTED_DIR=EXISTS"
            find "$EXPECTED" -maxdepth 1 -type f -printf '%f\n' | sort
          else
            echo "EXPECTED_DIR=MISSING"
          fi
