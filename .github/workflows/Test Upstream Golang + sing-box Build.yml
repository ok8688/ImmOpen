name: 🧪 Test Upstream Golang + PassWall sing-box

on:
  workflow_dispatch:

jobs:
  test-golang-singbox:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:

      # ================================================================
      # 1. Checkout current repository
      # ================================================================
      - name: Checkout Repo
        uses: actions/checkout@v4

      # ================================================================
      # 2. Install build dependencies
      # ================================================================
      - name: Install Build Dependencies
        run: |
          set -euo pipefail

          sudo apt-get update -qq

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            gettext \
            git \
            libncurses5-dev \
            libssl-dev \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            jq \
            python3-setuptools

      # ================================================================
      # 3. Clone ImmortalWrt master
      # ================================================================
      - name: Clone ImmortalWrt Master
        run: |
          set -euo pipefail

          echo "================================================"
          echo "📥 Cloning ImmortalWrt master"
          echo "================================================"

          git clone \
            --depth=1 \
            -b master \
            https://github.com/immortalwrt/immortalwrt.git \
            openwrt

          cd openwrt

          echo
          echo "===== ImmortalWrt Revision ====="
          git log -1 --oneline
          git rev-parse HEAD

      # ================================================================
      # 4. Update ImmortalWrt feeds
      # ================================================================
      - name: Update Base Feeds
        run: |
          set -euo pipefail

          cd openwrt

          echo "================================================"
          echo "🔄 Updating ImmortalWrt feeds"
          echo "================================================"

          ./scripts/feeds update -a

      # ================================================================
      # 5. Replace ONLY Golang feed with upstream OpenWrt/packages
      # ================================================================
      - name: Replace Golang Feed With OpenWrt Upstream
        run: |
          set -euo pipefail

          cd openwrt

          echo "================================================"
          echo "💥 Replacing Golang feed"
          echo "================================================"

          rm -rf feeds/packages/lang/golang

          git clone \
            --depth=1 \
            https://github.com/openwrt/packages.git \
            /tmp/openwrt-packages

          cp -a \
            /tmp/openwrt-packages/lang/golang \
            feeds/packages/lang/golang

          echo
          echo "===== OpenWrt/packages Revision ====="

          cd /tmp/openwrt-packages

          git log -1 --oneline
          git rev-parse HEAD

          cd -

          rm -rf /tmp/openwrt-packages

      # ================================================================
      # 6. Inspect upstream Golang
      # ================================================================
      - name: Inspect Upstream Golang
        run: |
          set -euo pipefail

          cd openwrt

          echo "================================================"
          echo "🔍 Inspecting upstream Golang"
          echo "================================================"

          echo
          echo "===== Golang Version Definitions ====="

          grep -RniE \
            'GO_DEFAULT_VERSION|GO_VERSION|GO_HOST_VERSION' \
            feeds/packages/lang/golang/ \
            2>/dev/null || true

          echo
          echo "===== Golang Makefiles ====="

          find feeds/packages/lang/golang \
            -maxdepth 4 \
            -type f \
            -name Makefile \
            -print

      # ================================================================
      # 7. Install base feeds
      # ================================================================
      - name: Install Base Feeds
        run: |
          set -euo pipefail

          cd openwrt

          echo "================================================"
          echo "📦 Installing base feeds"
          echo "================================================"

          ./scripts/feeds install -a -f

      # ================================================================
      # 8. Remove OpenWrt built-in PassWall core packages
      #
      # This follows PassWall's documented installation method:
      # remove built-in core packages before cloning PassWall packages.
      # ================================================================
      - name: Remove Built-in Core Packages
        run: |
          set -euo pipefail

          cd openwrt

          echo "================================================"
          echo "🗑️ Removing built-in OpenWrt core packages"
          echo "================================================"

          rm -rf feeds/packages/net/{ \
            xray-core, \
            v2ray-geodata, \
            sing-box, \
            chinadns-ng, \
            dns2socks, \
            hysteria, \
            ipt2socks, \
            microsocks, \
            naiveproxy, \
            shadowsocks-rust, \
            shadowsocksr-libev, \
            simple-obfs, \
            tcping, \
            v2ray-plugin, \
            xray-plugin, \
            geoview, \
            shadow-tls \
          }

          echo
          echo "===== Built-in sing-box Check ====="

          if find feeds -type f -path '*/sing-box/Makefile' -print | grep -q .; then
            echo "❌ Built-in sing-box Makefile still exists"
            find feeds -type f -path '*/sing-box/Makefile' -print
            exit 1
          fi

          echo "✅ Built-in sing-box removed"

      # ================================================================
      # 9. Clone PassWall packages
      #
      # sing-box comes from this repository.
      # ================================================================
      - name: Clone PassWall Packages
        run: |
          set -euo pipefail

          cd openwrt

          echo "================================================"
          echo "📥 Cloning PassWall packages"
          echo "================================================"

          git clone \
            --depth=1 \
            https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git \
            package/passwall-packages

          echo
          echo "===== PassWall Packages Revision ====="

          cd package/passwall-packages

          git log -1 --oneline
          git rev-parse HEAD

          cd ../..

      # ================================================================
      # 10. Clone PassWall LuCI
      # ================================================================
      - name: Clone PassWall LuCI
        run: |
          set -euo pipefail

          cd openwrt

          echo "================================================"
          echo "📥 Cloning PassWall LuCI"
          echo "================================================"

          git clone \
            --depth=1 \
            https://github.com/Openwrt-Passwall/openwrt-passwall.git \
            package/passwall-luci

          echo
          echo "===== PassWall LuCI Revision ====="

          cd package/passwall-luci

          git log -1 --oneline
          git rev-parse HEAD

          cd ../..

      # ================================================================
      # 11. Verify PassWall sing-box package
      # ================================================================
      - name: Verify PassWall sing-box Package
        run: |
          set -euo pipefail

          cd openwrt

          echo "================================================"
          echo "🔍 Verifying PassWall sing-box package"
          echo "================================================"

          SINGBOX_MK="package/passwall-packages/sing-box/Makefile"

          if [ ! -f "${SINGBOX_MK}" ]; then
            echo "❌ PassWall sing-box Makefile not found"
            echo "Expected:"
            echo "${SINGBOX_MK}"
            exit 1
          fi

          echo "✅ Found:"
          echo "${SINGBOX_MK}"

          echo
          echo "===== sing-box Makefile ====="

          cat "${SINGBOX_MK}"

          echo
          echo "===== Go Dependency References ====="

          grep -nEi \
            'golang|GO_PKG|GO_BUILD|GoBinPackage|BuildPackage' \
            "${SINGBOX_MK}" \
            || true

      # ================================================================
      # 12. Install PassWall package definitions
      # ================================================================
      - name: Install PassWall Packages
        run: |
          set -euo pipefail

          cd openwrt

          echo "================================================"
          echo "📦 Installing PassWall package definitions"
          echo "================================================"

          ./scripts/feeds install -a -f

          echo
          echo "===== Package Registration Check ====="

          make package/passwall-packages/sing-box/compile \
            V=s \
            -n

      # ================================================================
      # 13. Generate minimal x86_64 configuration
      # ================================================================
      - name: Generate Minimal Config
        run: |
          set -euo pipefail

          cd openwrt

          cat > .config <<'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y

          CONFIG_PACKAGE_sing-box=y
          CONFIG_PACKAGE_luci-app-passwall=y
          EOF

          echo "================================================"
          echo "⚙️ Running make defconfig"
          echo "================================================"

          make defconfig

          echo
          echo "===== Selected Packages ====="

          grep -E \
            '^CONFIG_PACKAGE_(sing-box|luci-app-passwall)=' \
            .config

      # ================================================================
      # 14. Prepare Host Golang
      # ================================================================
      - name: Prepare Host Golang
        run: |
          set -euo pipefail

          cd openwrt

          echo "================================================"
          echo "🧩 Preparing Host Golang"
          echo "================================================"

          make package/golang/host/prepare V=s

      # ================================================================
      # 15. Download Host Golang
      # ================================================================
      - name: Download Host Golang
        run: |
          set -euo pipefail

          cd openwrt

          echo "================================================"
          echo "🔽 Downloading Host Golang"
          echo "================================================"

          make package/golang/host/download V=s

      # ================================================================
      # 16. Compile Host Golang
      # ================================================================
      - name: Compile Host Golang
        run: |
          set -euo pipefail

          cd openwrt

          echo "================================================"
          echo "🔨 Compiling Host Golang"
          echo "================================================"

          make package/golang/host/compile \
            -j"$(nproc)" \
            V=s

      # ================================================================
      # 17. Verify actual generated Go toolchain
      # ================================================================
      - name: Verify Go Toolchain
        run: |
          set -euo pipefail

          cd openwrt

          echo "================================================"
          echo "🔍 Verifying Generated Go Toolchain"
          echo "================================================"

          echo
          echo "===== Go Binaries Found ====="

          find staging_dir \
            -type f \
            -path '*/bin/go' \
            -print

          GO_BIN="$(
            find staging_dir/hostpkg/lib \
              -type f \
              -path '*/bin/go' \
              ! -path '*/go-bootstrap/*' \
              | sort -V \
              | tail -n 1
          )"

          if [ -z "${GO_BIN}" ]; then
            echo "❌ Compiled Go toolchain not found"
            exit 1
          fi

          echo
          echo "===== Active Go Binary ====="
          echo "${GO_BIN}"

          echo
          echo "===== Go Version ====="
          "${GO_BIN}" version

          echo
          echo "===== Go Environment ====="
          "${GO_BIN}" env GOVERSION GOOS GOARCH

          echo
          echo "===== Go Root ====="
          "${GO_BIN}" env GOROOT

          echo
          echo "===== Go Path ====="
          "${GO_BIN}" env GOPATH

      # ================================================================
      # 18. Download PassWall sing-box source
      # ================================================================
      - name: Download PassWall sing-box
        run: |
          set -euo pipefail

          cd openwrt

          echo "================================================"
          echo "🔽 Downloading PassWall sing-box"
          echo "================================================"

          make package/passwall-packages/sing-box/download V=s

      # ================================================================
      # 19. Prepare PassWall sing-box
      # ================================================================
      - name: Prepare PassWall sing-box
        run: |
          set -euo pipefail

          cd openwrt

          echo "================================================"
          echo "🧩 Preparing PassWall sing-box"
          echo "================================================"

          make package/passwall-packages/sing-box/prepare V=s

      # ================================================================
      # 20. Compile PassWall sing-box
      #
      # IMPORTANT:
      # Do NOT use "|| true".
      # Capture the real exit code while preserving the complete log.
      # ================================================================
      - name: Compile PassWall sing-box
        id: singbox_compile
        run: |
          set -u

          cd openwrt

          mkdir -p ../diagnostics

          LOG="../diagnostics/singbox-build.log"

          echo "================================================"
          echo "🔥 COMPILING PASSWALL sing-box"
          echo "================================================"

          echo
          echo "Full build log:"
          echo "${LOG}"

          set +e

          make package/passwall-packages/sing-box/compile \
            -j"$(nproc)" \
            V=s \
            2>&1 | tee "${LOG}"

          BUILD_RC=${PIPESTATUS[0]}

          set -e

          echo
          echo "================================================"
          echo "sing-box build exit code: ${BUILD_RC}"
          echo "================================================"

          echo "${BUILD_RC}" > ../diagnostics/singbox-build-exit-code.txt

          exit "${BUILD_RC}"

      # ================================================================
      # 21. Collect complete diagnostic report
      #
      # Always runs, whether build succeeds or fails.
      # ================================================================
      - name: Generate Diagnostic Report
        if: always()
        run: |
          set +e

          REPORT="openwrt/../diagnostics/singbox-build-report.txt"

          mkdir -p diagnostics

          {
            echo "============================================================"
            echo "PASSWALL SING-BOX BUILD DIAGNOSTIC REPORT"
            echo "============================================================"
            echo

            echo "Generated:"
            date -u '+%Y-%m-%dT%H:%M:%SZ'
            echo

            echo "============================================================"
            echo "[1] RUNNER INFORMATION"
            echo "============================================================"

            uname -a
            echo

            echo "CPU:"
            nproc
            echo

            echo "Memory:"
            free -h
            echo

            echo "Disk:"
            df -h
            echo

            echo "============================================================"
            echo "[2] IMMORTALWRT REVISION"
            echo "============================================================"

            if [ -d openwrt/.git ]; then
              git -C openwrt log -1 --oneline
              git -C openwrt rev-parse HEAD
            else
              echo "ImmortalWrt git repository unavailable"
            fi

            echo

            echo "============================================================"
            echo "[3] OPENWRT/PACKAGES GOLANG REVISION"
            echo "============================================================"

            if [ -f /tmp/openwrt-packages-revision.txt ]; then
              cat /tmp/openwrt-packages-revision.txt
            else
              echo "Revision file not available"
            fi

            echo

            echo "============================================================"
            echo "[4] PASSWALL PACKAGES REVISION"
            echo "============================================================"

            if [ -d openwrt/package/passwall-packages/.git ]; then
              git -C openwrt/package/passwall-packages log -1 --oneline
              git -C openwrt/package/passwall-packages rev-parse HEAD
            else
              echo "PassWall packages repository unavailable"
            fi

            echo

            echo "============================================================"
            echo "[5] PASSWALL LUCi REVISION"
            echo "============================================================"

            if [ -d openwrt/package/passwall-luci/.git ]; then
              git -C openwrt/package/passwall-luci log -1 --oneline
              git -C openwrt/package/passwall-luci rev-parse HEAD
            else
              echo "PassWall LuCI repository unavailable"
            fi

            echo

            echo "============================================================"
            echo "[6] GOLANG VERSION DEFINITIONS"
            echo "============================================================"

            grep -RniE \
              'GO_DEFAULT_VERSION|GO_VERSION|GO_HOST_VERSION' \
              openwrt/feeds/packages/lang/golang/ \
              2>/dev/null || true

            echo

            echo "============================================================"
            echo "[7] GENERATED GO TOOLCHAIN"
            echo "============================================================"

            find openwrt/staging_dir \
              -type f \
              -path '*/bin/go' \
              -print \
              2>/dev/null || true

            GO_BIN="$(
              find openwrt/staging_dir/hostpkg/lib \
                -type f \
                -path '*/bin/go' \
                ! -path '*/go-bootstrap/*' \
                2>/dev/null \
                | sort -V \
                | tail -n 1
            )"

            if [ -n "${GO_BIN}" ]; then
              echo
              echo "Active Go:"
              echo "${GO_BIN}"

              echo
              echo "Version:"
              "${GO_BIN}" version

              echo
              echo "Environment:"
              "${GO_BIN}" env
            else
              echo "No compiled Go toolchain found"
            fi

            echo

            echo "============================================================"
            echo "[8] PASSWALL SING-BOX MAKEFILE"
            echo "============================================================"

            if [ -f openwrt/package/passwall-packages/sing-box/Makefile ]; then
              cat openwrt/package/passwall-packages/sing-box/Makefile
            else
              echo "sing-box Makefile unavailable"
            fi

            echo

            echo "============================================================"
            echo "[9] SING-BOX PACKAGE DIRECTORY"
            echo "============================================================"

            find openwrt/package/passwall-packages/sing-box \
              -maxdepth 3 \
              -type f \
              -print \
              2>/dev/null || true

            echo

            echo "============================================================"
            echo "[10] FEEDS CONFIGURATION"
            echo "============================================================"

            if [ -f openwrt/feeds.conf.default ]; then
              cat openwrt/feeds.conf.default
            fi

            echo

            echo "============================================================"
            echo "[11] ACTIVE CONFIGURATION"
            echo "============================================================"

            if [ -f openwrt/.config ]; then
              cat openwrt/.config
            else
              echo ".config unavailable"
            fi

            echo

            echo "============================================================"
            echo "[12] SING-BOX BUILD EXIT CODE"
            echo "============================================================"

            if [ -f diagnostics/singbox-build-exit-code.txt ]; then
              cat diagnostics/singbox-build-exit-code.txt
            else
              echo "Build exit code unavailable"
            fi

            echo

            echo "============================================================"
            echo "[13] ERROR SUMMARY"
            echo "============================================================"

            if [ -f diagnostics/singbox-build.log ]; then

              grep -iE \
                '(^|[^[:alnum:]])error[: ]|fatal:|failed|FAIL|undefined|cannot find|no such file|not found|exit code|Error [0-9]+|ERROR:' \
                diagnostics/singbox-build.log \
                | tail -n 300 \
                || true

            else
              echo "sing-box build log unavailable"
            fi

            echo

            echo "============================================================"
            echo "[14] LAST 300 BUILD LOG LINES"
            echo "============================================================"

            if [ -f diagnostics/singbox-build.log ]; then
              tail -n 300 diagnostics/singbox-build.log
            else
              echo "sing-box build log unavailable"
            fi

            echo

            echo "============================================================"
            echo "[15] BUILD DIRECTORY STATUS"
            echo "============================================================"

            find openwrt/build_dir \
              -maxdepth 4 \
              -type d \
              -iname '*sing-box*' \
              -print \
              2>/dev/null || true

            echo

            echo "============================================================"
            echo "[16] PACKAGE ARTIFACTS"
            echo "============================================================"

            find openwrt/bin openwrt/packages \
              -type f \
              \( \
                -name '*sing-box*.ipk' \
                -o \
                -name '*sing-box*.apk' \
              \) \
              -print \
              2>/dev/null || true

            echo

            echo "============================================================"
            echo "END OF DIAGNOSTIC REPORT"
            echo "============================================================"

          } > "${REPORT}"

          echo
          echo "================================================"
          echo "📋 Diagnostic report generated"
          echo "================================================"

          wc -l "${REPORT}"
          ls -lh "${REPORT}"

      # ================================================================
      # 22. Save useful diagnostic files
      # ================================================================
      - name: Collect Diagnostic Files
        if: always()
        run: |
          set +e

          mkdir -p diagnostics

          echo "================================================"
          echo "📦 Collecting diagnostic files"
          echo "================================================"

          # Golang Makefile
          if [ -f openwrt/feeds/packages/lang/golang/Makefile ]; then
            cp \
              openwrt/feeds/packages/lang/golang/Makefile \
              diagnostics/golang-Makefile
          fi

          find openwrt/feeds/packages/lang/golang \
            -type f \
            -name Makefile \
            -exec cp --parents {} diagnostics/ \; \
            2>/dev/null || true

          # sing-box Makefile
          if [ -f openwrt/package/passwall-packages/sing-box/Makefile ]; then
            cp \
              openwrt/package/passwall-packages/sing-box/Makefile \
              diagnostics/sing-box-Makefile
          fi

          # Build configuration
          if [ -f openwrt/.config ]; then
            cp openwrt/.config diagnostics/openwrt.config
          fi

          if [ -f openwrt/feeds.conf.default ]; then
            cp openwrt/feeds.conf.default diagnostics/feeds.conf.default
          fi

          # Versions
          {
            echo "ImmortalWrt:"
            git -C openwrt rev-parse HEAD 2>/dev/null || true

            echo
            echo "PassWall packages:"
            git -C openwrt/package/passwall-packages rev-parse HEAD 2>/dev/null || true

            echo
            echo "PassWall LuCI:"
            git -C openwrt/package/passwall-luci rev-parse HEAD 2>/dev/null || true
          } > diagnostics/revisions.txt

          echo
          echo "===== Diagnostic Files ====="

          find diagnostics \
            -maxdepth 3 \
            -type f \
            -printf '%p (%s bytes)\n' \
            2>/dev/null || true

      # ================================================================
      # 23. Upload diagnostics
      # ================================================================
      - name: Upload sing-box Diagnostic Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: singbox-build-diagnostics
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 7

      # ================================================================
      # 24. Final result
      # ================================================================
      - name: Final Verification
        if: success()
        run: |
          set -euo pipefail

          cd openwrt

          echo
          echo "================================================"
          echo "🎯 FINAL TEST RESULT"
          echo "================================================"

          echo
          echo "ImmortalWrt master:            ✅"
          echo "Upstream OpenWrt Golang:       ✅"
          echo "Host Golang compilation:       ✅"
          echo "Generated Go toolchain:        ✅"
          echo "PassWall packages:             ✅"
          echo "PassWall sing-box source:      ✅"
          echo "sing-box download:             ✅"
          echo "sing-box prepare:              ✅"
          echo "sing-box compilation:          ✅"

          echo
          echo "===== Go ====="

          GO_BIN="$(
            find staging_dir/hostpkg/lib \
              -type f \
              -path '*/bin/go' \
              ! -path '*/go-bootstrap/*' \
              | sort -V \
              | tail -n 1
          )"

          "${GO_BIN}" version

          echo
          echo "===== sing-box Artifacts ====="

          find bin packages \
            -type f \
            \( \
              -name '*sing-box*.ipk' \
              -o \
              -name '*sing-box*.apk' \
            \) \
            -print

          echo
          echo "================================================"
          echo "✅ UPSTREAM GOLANG + PASSWALL SING-BOX TEST PASSED"
          echo "================================================"
