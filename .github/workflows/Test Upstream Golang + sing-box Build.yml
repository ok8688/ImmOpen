name: 🧪 Test Upstream Golang + PassWall sing-box

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euo pipefail

          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gcc-multilib \
            gettext \
            git \
            libncurses5-dev \
            libssl-dev \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            jq \
            python3-setuptools \
            ninja-build \
            meson

      - name: Prepare ImmortalWrt
        run: |
          set -euo pipefail

          git clone \
            --depth=1 \
            -b master \
            https://github.com/immortalwrt/immortalwrt.git \
            openwrt

          cd openwrt

          ./scripts/feeds update -a
          ./scripts/feeds install -a -f

      - name: Replace Golang and PassWall sing-box
        run: |
          set -euo pipefail

          cd openwrt

          # Replace ONLY Golang with current upstream OpenWrt/packages.
          rm -rf feeds/packages/lang/golang

          git clone \
            --depth=1 \
            https://github.com/openwrt/packages.git \
            /tmp/openwrt-packages

          cp -a \
            /tmp/openwrt-packages/lang/golang \
            feeds/packages/lang/golang

          # Remove OpenWrt's built-in PassWall core packages.
          rm -rf \
            feeds/packages/net/xray-core \
            feeds/packages/net/v2ray-geodata \
            feeds/packages/net/sing-box

          # Add PassWall packages.
          git clone \
            --depth=1 \
            https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git \
            package/passwall-packages

          echo "ImmortalWrt:"
          git rev-parse HEAD

          echo "OpenWrt/packages:"
          git -C /tmp/openwrt-packages rev-parse HEAD

          echo "PassWall packages:"
          git -C package/passwall-packages rev-parse HEAD

          echo
          echo "sing-box Makefile:"
          test -f package/passwall-packages/sing-box/Makefile

      - name: Configure
        run: |
          set -euo pipefail

          cd openwrt

          cat > .config <<'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y
          CONFIG_PACKAGE_sing-box=y
          EOF

          make defconfig

          echo
          grep -E \
            '^(CONFIG_TARGET_x86|CONFIG_TARGET_x86_64|CONFIG_USE_APK|CONFIG_PACKAGE_sing-box)=' \
            .config

      - name: Install OpenWrt host tools
        run: |
          set -euo pipefail

          cd openwrt

          make tools/install -j"$(nproc)"

          test -x staging_dir/host/bin/ninja
          staging_dir/host/bin/ninja --version

      - name: Build Host Golang
        run: |
          set -euo pipefail

          cd openwrt

          mkdir -p ../diagnostics

          set +e

          make package/golang/host/compile \
            -j"$(nproc)" \
            V=s \
            2>&1 | tee ../diagnostics/golang-build.log

          rc=${PIPESTATUS[0]}

          set -e

          echo "${rc}" > ../diagnostics/golang-exit-code.txt

          exit "${rc}"

      - name: Build PassWall sing-box
        run: |
          set -euo pipefail

          cd openwrt

          mkdir -p ../diagnostics

          set +e

          make package/passwall-packages/sing-box/compile \
            -j"$(nproc)" \
            V=s \
            2>&1 | tee ../diagnostics/singbox-build.log

          rc=${PIPESTATUS[0]}

          set -e

          echo "${rc}" > ../diagnostics/singbox-exit-code.txt

          exit "${rc}"

      - name: Verify result
        if: success()
        run: |
          set -euo pipefail

          cd openwrt

          echo "===== Host Go ====="

          find staging_dir/hostpkg/lib \
            -type f \
            -path '*/bin/go' \
            ! -path '*/go-bootstrap/*' \
            -print

          GO_BIN="$(
            find staging_dir/hostpkg/lib \
              -type f \
              -path '*/bin/go' \
              ! -path '*/go-bootstrap/*' \
              | sort -V \
              | tail -n 1
          )"

          test -n "${GO_BIN}"
          "${GO_BIN}" version

          echo
          echo "===== OpenWrt Ninja ====="
          staging_dir/host/bin/ninja --version

          echo
          echo "===== sing-box artifact ====="

          find bin packages \
            -type f \
            \( \
              -name '*sing-box*.apk' \
              -o \
              -name '*sing-box*.ipk' \
            \) \
            -print

      - name: Collect diagnostics
        if: always()
        run: |
          set +e

          mkdir -p diagnostics

          if [ -d openwrt ]; then
            git -C openwrt rev-parse HEAD \
              > diagnostics/immortalwrt-revision.txt 2>&1

            git -C openwrt/package/passwall-packages rev-parse HEAD \
              > diagnostics/passwall-packages-revision.txt 2>&1

            git -C /tmp/openwrt-packages rev-parse HEAD \
              > diagnostics/openwrt-packages-revision.txt 2>&1

            cp openwrt/.config diagnostics/openwrt.config

            cp \
              openwrt/feeds/packages/lang/golang/golang/Makefile \
              diagnostics/golang-Makefile 2>/dev/null

            cp \
              openwrt/package/passwall-packages/sing-box/Makefile \
              diagnostics/sing-box-Makefile 2>/dev/null

            if [ -x openwrt/staging_dir/host/bin/ninja ]; then
              openwrt/staging_dir/host/bin/ninja --version \
                > diagnostics/openwrt-ninja-version.txt 2>&1
            fi
          fi

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: singbox-golang-test
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 7
