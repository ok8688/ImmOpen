name: 🧪 Locate libgcc_s

on:
  workflow_dispatch:

jobs:
  locate-libgcc:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Toolchain and Locate libgcc_s
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth=1 -b master \
            https://github.com/immortalwrt/immortalwrt.git openwrt

          cd openwrt

          cat > .config <<'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y
          EOF

          make defconfig >/dev/null

          echo "=== REVISION ==="
          git log -1 --oneline

          echo "=== TOOLCHAIN ==="
          make toolchain/install -j"$(nproc)" >/tmp/toolchain.log 2>&1

          TOOLCHAIN_DIR="$(find staging_dir -maxdepth 1 -type d \
            -name 'toolchain-x86_64_*_musl' | head -n 1)"

          echo "=== TOOLCHAIN DIR ==="
          echo "${TOOLCHAIN_DIR}"

          echo "=== LIBGCC ==="

          LIBGCC="$(find "${TOOLCHAIN_DIR}" \
            -type f \
            -name 'libgcc_s.so*' \
            | head -n 20)"

          if [ -n "${LIBGCC}" ]; then
            printf '%s\n' "${LIBGCC}"
          else
            echo "LIBGCC_S_NOT_FOUND"
          fi

          echo "=== GCC RUNTIME ==="

          GCC="$(find "${TOOLCHAIN_DIR}" \
            -type f \
            -name 'gcc' \
            -path '*/bin/gcc' \
            | head -n 1)"

          echo "GCC=${GCC}"

          if [ -n "${GCC}" ]; then
            "${GCC}" --version | head -n 1
            "${GCC}" -print-file-name=libgcc_s.so
          fi

          echo "=== EXPECTED DIRECTORY ==="
          ls -la "${TOOLCHAIN_DIR}/lib" 2>/dev/null || true
