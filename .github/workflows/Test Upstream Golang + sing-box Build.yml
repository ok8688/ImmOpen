name: SNAPSHOT - GCC final libgcc_s final probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare OpenWrt
        run: |
          set -euo pipefail
          git clone --depth=1 -b master https://github.com/immortalwrt/immortalwrt.git openwrt
          cd openwrt
          echo 'CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y' > .config
          make defconfig >/dev/null 2>&1

      - name: GCC final libgcc_s probe
        run: |
          set -euo pipefail
          cd openwrt

          make toolchain/gcc/final/compile -j"$(nproc)" >/dev/null 2>&1

          echo "=== GCC FINAL ==="
          find build_dir -type f \( -name 'libgcc_s.so' -o -name 'libgcc_s.so.*' \) -print 2>/dev/null | head -20

          echo "=== TOOLCHAIN LIB ==="
          find staging_dir -path '*/lib/libgcc_s.so*' -print 2>/dev/null | head -20
